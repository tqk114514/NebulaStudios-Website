name: CI

on:
  push:
    branches: [main, v4]
  pull_request:
    branches: [main, v4]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: knip（死导出与死文件）
        run: npm run knip

      - name: i18n 键完整性
        run: npm run check:i18n

      - name: ESLint
        run: npm run lint

      - name: Stylelint
        run: npm run lint:style

      - name: 类型检查
        run: npm run typecheck

      - name: 单元与组件测试
        run: npm test

      - name: 构建
        run: npm run build

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 提交信息（push）
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}"

      - name: 提交信息（pull_request）
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "origin/${{ github.base_ref }}" --to HEAD

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # AGENTS.md 与 docs/ 的每条条款都要带来源 URL（§16），链接失效即失败
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --config .lychee.toml 'AGENTS.md' 'docs/**/*.md' 'README.md'
          fail: true
