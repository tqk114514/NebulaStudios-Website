name: CI

on:
  push:
    branches: [main, v4]
  pull_request:
    branches: [main, v4]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: knip（死导出与死文件）
        run: npm run knip

      - name: i18n 键完整性
        run: npm run check:i18n

      - name: ESLint
        run: npm run lint

      - name: Stylelint
        run: npm run lint:style

      - name: 类型检查
        run: npm run typecheck

      - name: 单元与组件测试
        run: npm test

      - name: 构建
        run: npm run build

  server:
    runs-on: ubuntu-latest
    env:
      # §1：CI 用离线查询缓存（.sqlx/ 已提交），不连数据库
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # §6 CI 必跑清单；本地对应命令见 AGENTS.md
      - name: 格式（fmt --check）
        run: cargo fmt --all -- --check

      - name: 静态检查（clippy -D warnings）
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试
        run: cargo test

      - name: 文档（deny 断链）
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,typos-cli

      - name: 依赖许可与安全公告
        run: cargo deny check

      - name: 未用依赖
        run: cargo machete

      - name: 拼写
        run: typos

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 提交信息（push）
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}"

      - name: 提交信息（pull_request）
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "origin/${{ github.base_ref }}" --to HEAD

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # AGENTS.md 与 docs/ 的每条条款都要带来源 URL（§16），链接失效即失败。
      # 检查目标只列实际带来源链接的文档：v4 分支没有 README.md，
      # composable 的 index.md 里不含 URL。
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --config .lychee.toml 'AGENTS.md' 'docs/**/*.md'
          fail: true
