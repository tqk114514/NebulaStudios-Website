name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go (fmt / vet / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # img-processor-bin 不再入库，由 CI 实时编译（//go:embed 硬依赖）
      - name: Install Zig 0.16.0
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          /opt/zig/zig version
          echo "/opt/zig" >> "$GITHUB_PATH"

      - name: Build img-processor
        run: |
          cd img-processor
          zig build -Doptimize=ReleaseFast
          cp zig-out/bin/img-processor ../internal/services/img-processor-bin

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build ./...

  frontend:
    name: Frontend (tsc + esbuild bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: npm ci
        run: npm ci

      - name: TypeScript typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Full frontend build (cmd/build)
        run: go run ./cmd/build

  img-processor:
    name: Zig (img-processor tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mlugg/setup-zig 未适配 Zig 0.16 的命名变更（zig-<arch>-<os> 且稳定版在 /download/<ver>/），
      # 改用官方 URL 手动安装
      - name: Install Zig 0.16.0
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          /opt/zig/zig version
          echo "/opt/zig" >> "$GITHUB_PATH"

      - name: zig build test
        working-directory: img-processor
        run: zig build test
