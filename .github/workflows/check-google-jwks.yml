name: check-google-jwks

on:
  schedule:
    # 每天 03:00 UTC（北京时间 11:00）检查 Google 是否轮换了 id_token 签名密钥
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare Google JWKS with baseline
        run: python .github/scripts/check_google_jwks.py .github/google-jwks.json
