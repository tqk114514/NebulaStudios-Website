[workspace]
# 单 crate 仓库；空 [workspace] 表仅为承载 [workspace.lints]（AGENTS.md §6）

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
elided_lifetimes_in_paths = "warn"
unused_lifetimes = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[package]
name = "nebula-server"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[lints]
workspace = true

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = "0.8.9"
axum-prometheus = "0.10.1"
chrono = { version = "0.4.45", features = ["serde"] }
config = { version = "0.15.27", default-features = false }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
lettre = { version = "0.11.23", default-features = false, features = [
  "aws-lc-rs",
  "builder",
  "smtp-transport",
  "tokio1-rustls",
  "webpki-roots",
] }
metrics = "0.24.6"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = [
  "chrono",
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
  "uuid",
] }
thiserror = "2.0.21"
totp-rs = { version = "6.0.0", default-features = false, features = ["gen_secret", "std"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["cors", "limit", "request-id", "set-header"] }
tower_governor = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["serde", "v7"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1.5"
insta = "1.49.0"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
